<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270">
  <!-- Classic Mario Fire Flower — bold line-art style -->
  <!-- Left leaf -->
  <ellipse cx="62" cy="225" rx="42" ry="24" fill="#00A800" stroke="#000" stroke-width="5" transform="rotate(-10, 62, 225)"/>
  <!-- Right leaf -->
  <ellipse cx="138" cy="225" rx="42" ry="24" fill="#00A800" stroke="#000" stroke-width="5" transform="rotate(10, 138, 225)"/>
  <!-- Stem -->
  <rect x="90" y="148" width="20" height="82" rx="3" fill="#00A800" stroke="#000" stroke-width="5"/>
  <!-- Red outer ring -->
  <ellipse cx="100" cy="82" rx="78" ry="74" fill="#E52020" stroke="#000" stroke-width="5"/>
  <!-- Yellow middle ring -->
  <ellipse cx="100" cy="82" rx="56" ry="52" fill="#FFD800" stroke="#000" stroke-width="5"/>
  <!-- White face -->
  <ellipse cx="100" cy="82" rx="34" ry="30" fill="#FFFFFF" stroke="#000" stroke-width="4"/>
  <!-- Left eye -->
  <ellipse cx="86" cy="80" rx="6" ry="14" fill="#000"/>
  <!-- Right eye -->
  <ellipse cx="114" cy="80" rx="6" ry="14" fill="#000"/>
</svg>