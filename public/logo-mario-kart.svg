<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="40%" style="stop-color:#FBBE00"/>
      <stop offset="100%" style="stop-color:#E5A000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#CC1111"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1DA1F2"/>
      <stop offset="100%" style="stop-color:#0476D0"/>
    </linearGradient>
    <linearGradient id="rainbowStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E52521"/>
      <stop offset="25%" style="stop-color:#FBBE00"/>
      <stop offset="50%" style="stop-color:#43B047"/>
      <stop offset="75%" style="stop-color:#049CD8"/>
      <stop offset="100%" style="stop-color:#7B2D8E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- MARIO -->
  <g filter="url(#shadow)">
    <text x="10" y="52" font-family="'Impact','Arial Black',sans-serif" font-size="54" font-weight="900" fill="url(#redGrad)" stroke="#880000" stroke-width="2" letter-spacing="3">MARIO</text>
  </g>
  <!-- KART -->
  <g filter="url(#shadow)">
    <text x="10" y="105" font-family="'Impact','Arial Black',sans-serif" font-size="54" font-weight="900" fill="url(#blueGrad)" stroke="#003366" stroke-width="2" letter-spacing="3">KART</text>
  </g>
  <!-- CUP -->
  <g filter="url(#glow)">
    <text x="192" y="105" font-family="'Impact','Arial Black',sans-serif" font-size="54" font-weight="900" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2" letter-spacing="3">CUP</text>
  </g>
  <!-- Trophy icon -->
  <g transform="translate(335, 18)" filter="url(#glow)">
    <path d="M10 0h30v8c0 12-6 20-15 26-9-6-15-14-15-26V0z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <path d="M0 4h10v6c-4 0-8-2-10-6z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <path d="M40 4h10c-2 4-6 6-10 6V4z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <rect x="15" y="34" width="20" height="4" rx="1" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <rect x="10" y="38" width="30" height="6" rx="2" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1"/>
    <text x="25" y="22" text-anchor="middle" font-family="Impact,sans-serif" font-size="14" font-weight="bold" fill="#B8860B">1</text>
  </g>
  <!-- Rainbow underline -->
  <rect x="10" y="112" width="380" height="4" rx="2" fill="url(#rainbowStroke)"/>
</svg>